
name: Build FilmCamera for iPhone

on:
  workflow_dispatch:
  push:
    branches: ["main", "build-v3-camera-editor"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project FilmCamera.xcodeproj \
            -scheme FilmCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/FilmCamera.app"
          mkdir -p Payload
          cp -R "$APP" Payload/FilmCamera.app
          zip -r FilmCamera-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FilmCamera-unsigned-ipa
          path: FilmCamera-unsigned.ipa
