name: FilmCamera
options:
  bundleIdPrefix: com.filmcamera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.filmcamera.ios
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "FilmCamera needs camera access to capture photographs."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "FilmCamera saves your photographs to your library."
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleDisplayName: "Film Camera"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  FilmCamera:
    type: application
    platform: iOS
    sources:
      - path: FilmCamera
    settings:
      base:
        PRODUCT_NAME: FilmCamera
